<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyTimer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@300;600;800&display=swap">
<style>
/* 링 타이머(가운데에서 살짝 왼쪽) | 블루 오늘 카드 / 아래에 잔디 */
:root {
  --bg: #f4f4f3; --card: #ffffff; --fg: #222222; --muted: #8c8c8a; --line: #e2e2df; --empty: #ebebe8;
  --blue: #34548a; --on-blue: #f3f6fb; --b1: #c9d5ea; --b2: #93abd3; --b3: #5d7fb8; --b4: #34548a;
  --shade: rgba(20, 20, 20, .35);
  --font: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --num: "Nunito", "Gowun Dodum", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414; --card: #1d1d1d; --fg: #ececea; --muted: #7e7e7c; --line: #2c2c2b; --empty: #262625;
    --blue: #7f9ed6; --on-blue: #10182a; --b1: #26324a; --b2: #3b5384; --b3: #5c7ebf; --b4: #8eabe0;
    --shade: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; }
[hidden] { display: none !important; }

.wrap { max-width: 800px; margin: 0 auto; padding: 48px 16px; display: flex; flex-direction: column; gap: 20px; }
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.logo { font-family: var(--num); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
.logo span { color: var(--blue); }
.bar .date { color: var(--muted); font-size: 13px; }

.top { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px; min-width: 0; }

.timer { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.modes { display: flex; background: var(--empty); border-radius: 999px; padding: 4px; }
.modes button { font: inherit; font-size: 13px; border: none; background: none; color: var(--muted); padding: 7px 18px; border-radius: 999px; cursor: pointer; }
.modes button.on { background: var(--card); color: var(--fg); }
.modes button:disabled { cursor: default; }

.ring { position: relative; width: min(270px, 100%); aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--empty); }
.ring .prog { stroke: var(--blue); stroke-linecap: round; transition: stroke-dashoffset .6s; }
.resting .ring .prog { stroke: var(--b2); }
.ring .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.state { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.running .dot { background: var(--blue); animation: breathe 1.6s ease-in-out infinite; }
.running .state { color: var(--blue); }
.clock { font-family: var(--num); font-weight: 300; font-size: clamp(40px, 12vw, 50px); font-variant-numeric: tabular-nums; line-height: 1; }

.pomo-set { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 13px; }
.pomo-set label { display: flex; align-items: center; gap: 6px; }
.pomo-set select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; }

.toggle {
  font: inherit; font-size: 15px; cursor: pointer; border: none; border-radius: 999px;
  padding: 12px 36px; background: var(--blue); color: var(--on-blue); transition: transform .12s;
}
.toggle:active { transform: scale(.96); }
.toggle:focus-visible, .modes button:focus-visible { outline: 3px solid var(--b2); outline-offset: 3px; }
.running .toggle { background: var(--fg); color: var(--card); }
.hint { color: var(--muted); font-size: 12px; text-align: center; }

.today { background: var(--blue); color: var(--on-blue); border-color: var(--blue); display: flex; flex-direction: column; justify-content: space-between; gap: 28px; }
.label { font-size: 13px; letter-spacing: .04em; opacity: .75; }
.big { font-family: var(--num); font-weight: 600; font-size: 40px; font-variant-numeric: tabular-nums; margin-top: 8px; line-height: 1.1; }
.big small { font-family: var(--font); font-size: 15px; font-weight: 400; opacity: .75; margin-left: 2px; }
.today .row { display: flex; gap: 24px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid color-mix(in srgb, var(--on-blue) 25%, transparent); }
.mid { font-family: var(--num); font-weight: 600; font-size: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; }

.grass-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.grass-head .label { color: var(--muted); opacity: 1; }
.legend { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.scroll { overflow-x: auto; padding-bottom: 4px; }
.grass { display: grid; grid-template-rows: repeat(7, 15px); grid-auto-flow: column; grid-auto-columns: 15px; gap: 5px; width: max-content; margin: 0 auto; }
.sq { border-radius: 4px; background: var(--empty); }
.sq.l1 { background: var(--b1); }
.sq.l2 { background: var(--b2); }
.sq.l3 { background: var(--b3); }
.sq.l4 { background: var(--b4); }
.sq.now { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--muted); }
.sq.future { visibility: hidden; }
.legend .sq { width: 12px; height: 12px; }

.note { background: var(--b1); color: var(--fg); border-radius: 14px; padding: 12px 16px; font-size: 13px; }

.modal { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal .card { width: min(340px, 100%); text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; animation: pop .25s ease-out; }
.modal b { font-size: 19px; font-weight: 400; }
.modal p { margin: 0; color: var(--muted); }

@keyframes breathe { 50% { opacity: .3; transform: scale(.8); } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .running .dot, .modal .card { animation: none; } .ring .prog { transition: none; } }
@media (max-width: 640px) {
  .wrap { padding-block: 28px; }
  .top { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="logo">Study<span>Timer</span></div><div class="date" id="date"></div></div>

  <div class="note" id="note" hidden></div>

  <div class="top">
    <div class="card timer" id="timer">
      <div class="modes">
        <button type="button" id="modeWatch" class="on">스톱워치</button>
        <button type="button" id="modePomo">뽀모도로</button>
      </div>
      <div class="ring">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="46"></circle>
          <circle class="prog" id="prog" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></circle>
        </svg>
        <div class="inner">
          <div class="state"><span class="dot"></span><span id="state">쉬는 중</span></div>
          <div class="clock" id="clock">00:00:00</div>
        </div>
      </div>
      <div class="pomo-set" id="pomoSet" hidden>
        <label for="focusMin">집중
          <select id="focusMin"><option>15</option><option selected>25</option><option>30</option><option>45</option><option>50</option></select>분
        </label>
        <label for="breakMin">휴식
          <select id="breakMin"><option selected>5</option><option>10</option><option>15</option></select>분
        </label>
      </div>
      <button class="toggle" id="toggle" type="button">시작하기</button>
      <div class="hint" id="hint"></div>
    </div>

    <div class="card today">
      <div>
        <div class="label">오늘 공부한 시간</div>
        <div class="big" id="todayTotal">0<small>분</small></div>
      </div>
      <div class="row">
        <div><div class="label">연속</div><div class="mid" id="streak">0일</div></div>
        <div><div class="label">이번 달</div><div class="mid" id="month">0일</div></div>
        <div><div class="label">뽀모도로</div><div class="mid" id="pomoToday">0회</div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="grass-head">
      <div class="label">최근 20주</div>
      <div class="legend">쉰 날 <span class="sq"></span><span class="sq l1"></span><span class="sq l2"></span><span class="sq l3"></span><span class="sq l4"></span> 4시간+</div>
    </div>
    <div class="scroll"><div class="grass" id="grass"></div></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="card">
    <b id="modalTitle"></b>
    <p id="modalText"></p>
    <button class="toggle" id="modalOk" type="button">확인</button>
  </div>
</div>

<script>
const WEEKS = 20;
const KEY = "studytimer";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hms = s => `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;

// 시작 시각만 저장하고 지금 시각과의 차이로 계산 → 페이지를 닫아도 시간이 흐름
const S = {
  days: {},        // "YYYY-MM-DD" -> 공부한 초
  pomos: {},       // "YYYY-MM-DD" -> 끝낸 뽀모도로 수
  mode: "watch",   // "watch" | "pomo"
  watchStart: null,
  pomo: null,      // { phase: "focus" | "break", start, end }
  focusMin: 25,
  breakMin: 5,
};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY))); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let lastDay = keyOf(new Date());
let alarmOn = false;
let audio = null;

// 자정을 넘긴 공부 시간을 날짜별로 나눔
function splitByDay(start, end) {
  const out = {};
  for (let t = start; t < end;) {
    const d = new Date(t);
    const next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
    const e = Math.min(end, next);
    out[keyOf(d)] = (out[keyOf(d)] || 0) + (e - t) / 1000;
    t = e;
  }
  return out;
}

function record(start, end) {
  const parts = splitByDay(start, end);
  for (const k in parts) S.days[k] = Math.round((S.days[k] || 0) + parts[k]);
}

function liveRange() {
  const now = Date.now();
  if (S.watchStart) return [S.watchStart, now];
  if (S.pomo?.phase === "focus") return [S.pomo.start, Math.min(now, S.pomo.end)];
  return null;
}

function secondsOn(key) {
  const r = liveRange();
  return (S.days[key] || 0) + (r ? splitByDay(r[0], r[1])[key] || 0 : 0);
}

function running() { return !!(S.watchStart || S.pomo); }

function renderClock() {
  const now = Date.now();
  let shown, ratio;
  if (S.mode === "watch") {
    const s = S.watchStart ? Math.floor((now - S.watchStart) / 1000) : 0;
    shown = s; ratio = (s % 3600) / 3600;
  } else if (S.pomo) {
    shown = Math.max(0, Math.ceil((S.pomo.end - now) / 1000));
    ratio = (now - S.pomo.start) / (S.pomo.end - S.pomo.start);
  } else {
    shown = S.focusMin * 60; ratio = 0;
  }
  $("clock").textContent = hms(shown);
  $("prog").style.strokeDashoffset = 100 - Math.min(1, ratio) * 100;
  document.title = alarmOn ? "● 시간 종료 · StudyTimer" : running() ? `${hms(shown)} · StudyTimer` : "StudyTimer";

  const today = Math.floor(secondsOn(keyOf(new Date())) / 60);
  $("todayTotal").innerHTML = today >= 60
    ? `${Math.floor(today / 60)}<small>시간</small> ${today % 60}<small>분</small>`
    : `${today}<small>분</small>`;
}

function renderStats() {
  const now = new Date();
  const pomoMode = S.mode === "pomo";
  const resting = S.pomo?.phase === "break";
  $("date").textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${"일월화수목금토"[now.getDay()]}요일`;

  $("modeWatch").classList.toggle("on", !pomoMode);
  $("modePomo").classList.toggle("on", pomoMode);
  $("modeWatch").disabled = $("modePomo").disabled = running();
  $("pomoSet").hidden = !pomoMode;
  $("focusMin").value = S.focusMin;
  $("breakMin").value = S.breakMin;
  $("focusMin").disabled = $("breakMin").disabled = running();

  $("timer").classList.toggle("running", running());
  $("timer").classList.toggle("resting", resting);
  $("state").textContent = resting ? "쉬는 시간" : running() ? "공부 중" : "쉬는 중";
  $("toggle").textContent = resting ? "휴식 건너뛰기" : running() ? "그만하기" : "시작하기";
  $("hint").textContent = pomoMode
    ? "시간이 끝나면 다른 창을 보고 있어도 알림이 와요"
    : "링 한 바퀴가 1시간 · 스페이스바로도 켜고 꺼요";

  // 오늘을 아직 안 했으면 어제부터 셈
  let streak = 0;
  const d = new Date(now);
  if (!secondsOn(keyOf(d))) d.setDate(d.getDate() - 1);
  while (secondsOn(keyOf(d)) > 0) { streak++; d.setDate(d.getDate() - 1); }
  $("streak").textContent = `${streak}일`;

  let month = 0;
  for (const c = new Date(now.getFullYear(), now.getMonth(), 1); c <= now; c.setDate(c.getDate() + 1)) {
    if (secondsOn(keyOf(c)) > 0) month++;
  }
  $("month").textContent = `${month}일`;
  $("pomoToday").textContent = `${S.pomos[keyOf(now)] || 0}회`;

  renderGrass(now);
  renderClock();
}

function level(sec) {
  const h = sec / 3600;
  return sec <= 0 ? 0 : h < 1 ? 1 : h < 2 ? 2 : h < 4 ? 3 : 4;
}

function renderGrass(now) {
  const todayKey = keyOf(now);
  const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() - (WEEKS - 1) * 7);
  const cells = [];
  for (let i = 0; i < WEEKS * 7; i++) {
    const k = keyOf(day);
    const sec = secondsOn(k);
    const cls = ["sq"];
    if (sec > 0) cls.push("l" + level(sec));
    if (k === todayKey) cls.push("now");
    if (day > now) cls.push("future");
    cells.push(`<span class="${cls.join(" ")}" title="${k} · ${Math.round(sec / 60)}분"></span>`);
    day.setDate(day.getDate() + 1);
  }
  $("grass").innerHTML = cells.join("");
}

function showNote(text) {
  $("note").textContent = text;
  $("note").hidden = !text;
}

// 알람: Windows 알림(우측 하단) + 페이지 팝업 + 소리
function chime() {
  if (!audio) return;
  [0, 0.35, 0.7].forEach(t => {
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audio.currentTime + t);
    g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.3);
    o.connect(g).connect(audio.destination);
    o.start(audio.currentTime + t);
    o.stop(audio.currentTime + t + 0.32);
  });
}

function alarm(title, text) {
  alarmOn = true;
  $("modalTitle").textContent = title;
  $("modalText").textContent = text;
  $("modal").hidden = false;
  chime();
  if ("Notification" in window && Notification.permission === "granted") {
    const n = new Notification(title, { body: text, tag: "studytimer", requireInteraction: true });
    n.onclick = () => { window.focus(); n.close(); };
  }
}

$("modalOk").addEventListener("click", () => {
  alarmOn = false;
  $("modal").hidden = true;
  renderClock();
});

// 끝난 단계를 처리 (페이지를 닫아 둔 사이에 여러 단계가 끝났을 수도 있음)
function checkPomo() {
  let msg = null;
  while (S.pomo && Date.now() >= S.pomo.end) {
    if (S.pomo.phase === "focus") {
      record(S.pomo.start, S.pomo.end);
      const k = keyOf(new Date(S.pomo.end));
      S.pomos[k] = (S.pomos[k] || 0) + 1;
      S.pomo = { phase: "break", start: S.pomo.end, end: S.pomo.end + S.breakMin * 60000 };
      msg = ["집중 시간이 끝났어요!", `${S.breakMin}분 쉬고 와요.`];
    } else {
      S.pomo = null;
      msg = ["쉬는 시간이 끝났어요!", "다시 집중해 볼까요?"];
    }
  }
  if (msg) {
    save();
    renderStats();
    alarm(...msg);
  }
}

async function toggle() {
  if (S.mode === "watch") {
    if (!S.watchStart) S.watchStart = Date.now();
    else { record(S.watchStart, Date.now()); S.watchStart = null; }
  } else if (!S.pomo) {
    audio = audio || new AudioContext();
    if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission();
    if (!("Notification" in window) || Notification.permission !== "granted") {
      showNote("알림이 꺼져 있어 Windows 알림은 오지 않아요. 주소창 왼쪽 자물쇠 → 알림 → 허용으로 켤 수 있어요. 소리와 팝업은 그대로 울려요.");
    } else showNote("");
    S.pomo = { phase: "focus", start: Date.now(), end: Date.now() + S.focusMin * 60000 };
  } else {
    if (S.pomo.phase === "focus") record(S.pomo.start, Date.now());
    S.pomo = null;
  }
  save();
  renderStats();
}

function setMode(mode) {
  if (running()) return;
  S.mode = mode;
  save();
  renderStats();
}

$("toggle").addEventListener("click", toggle);
$("modeWatch").addEventListener("click", () => setMode("watch"));
$("modePomo").addEventListener("click", () => setMode("pomo"));
$("focusMin").addEventListener("change", e => { S.focusMin = +e.target.value; save(); renderClock(); });
$("breakMin").addEventListener("change", e => { S.breakMin = +e.target.value; save(); });
document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target === document.body) { e.preventDefault(); toggle(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderStats(); });

// 다른 창을 보고 있어도 제때 울리도록, 백그라운드에서 느려지지 않는 Worker로 1초마다 확인
function tick() {
  checkPomo();
  const k = keyOf(new Date());
  if (k !== lastDay) { lastDay = k; renderStats(); }
  else if (running()) renderClock();
}
try {
  new Worker(URL.createObjectURL(new Blob(["setInterval(() => postMessage(0), 1000)"]))).onmessage = tick;
} catch (e) {
  setInterval(tick, 1000);
}

renderStats();
checkPomo();
</script>
</body>
</html>
