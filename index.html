<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyTimer</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@300;600;800&display=swap">
<style>
/* 링 타이머 | (오늘 한 줄 카드 + 시간표/ToDo 카드) / 아래에 잔디 — 화이트 모드 고정 */
:root {
  --bg: #f4f4f3; --card: #ffffff; --fg: #222222; --muted: #8c8c8a; --line: #e2e2df; --empty: #ebebe8;
  --blue: #34548a; --on-blue: #f3f6fb; --b1: #dbe3f0; --b2: #93abd3; --b3: #5d7fb8; --b4: #34548a;
  --shade: rgba(20, 20, 20, .35);
  --font: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --num: "Nunito", "Gowun Dodum", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--b2); outline-offset: 2px; }

.wrap { max-width: 980px; margin: 0 auto; padding: 44px 16px; display: flex; flex-direction: column; gap: 20px; }
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.logo { font-family: var(--num); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.logo img { width: 26px; height: 26px; }
.logo span { color: var(--blue); }
.bar .date { color: var(--muted); font-size: 13px; }

.top { display: grid; grid-template-columns: 1fr 1.15fr; gap: 20px; }
.side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px; min-width: 0; }
.label { font-size: 13px; letter-spacing: .04em; color: var(--muted); }

.pill { display: flex; background: var(--empty); border-radius: 999px; padding: 4px; }
.pill button { font-size: 13px; border: none; background: none; color: var(--muted); padding: 6px 16px; border-radius: 999px; }
.pill button.on { background: var(--card); color: var(--fg); }
.pill button:disabled { cursor: default; }

/* 타이머 */
.timer { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.ring { position: relative; width: min(260px, 100%); aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--empty); }
.ring .prog { stroke: var(--blue); stroke-linecap: round; transition: stroke-dashoffset .6s; }
.resting .ring .prog { stroke: var(--b2); }
.ring .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.state { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.running .dot { background: var(--blue); animation: breathe 1.6s ease-in-out infinite; }
.running .state { color: var(--blue); }
.clock { font-family: var(--num); font-weight: 300; font-size: clamp(40px, 12vw, 48px); font-variant-numeric: tabular-nums; line-height: 1; }
.pomo-set { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 13px; }
.pomo-set label { display: flex; align-items: center; gap: 6px; }
select, input[type="text"], input[type="time"] { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; min-width: 0; }
.main-btn { font-size: 15px; border: none; border-radius: 999px; padding: 12px 36px; background: var(--blue); color: var(--on-blue); transition: transform .12s; }
.main-btn:active { transform: scale(.96); }
.running .main-btn { background: var(--fg); color: var(--card); }
.hint { color: var(--muted); font-size: 12px; text-align: center; }

/* 오늘 한 줄 카드 */
.today { background: var(--blue); color: var(--on-blue); border-color: var(--blue); padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.today .label { color: inherit; opacity: .75; font-size: 12px; }
.big { font-family: var(--num); font-weight: 600; font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 2px; }
.big small { font-family: var(--font); font-size: 13px; font-weight: 400; opacity: .75; margin-left: 2px; }
.stats { display: flex; gap: 18px; }
.mid { font-family: var(--num); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* 시간표 / ToDo 카드 */
.plan { padding: 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.plan-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.plus { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 18px; line-height: 1; color: var(--blue); }
.plus:hover { background: var(--b1); }

.tt-scroll { overflow: auto; max-height: 300px; border: 1px solid var(--line); border-radius: 14px; }
.tt { display: grid; grid-template-columns: 34px repeat(7, minmax(44px, 1fr)); min-width: 360px; font-size: 11px; }
.tt .dayname { position: sticky; top: 0; z-index: 2; background: var(--card); text-align: center; padding: 6px 0; color: var(--muted); border-bottom: 1px solid var(--line); }
.tt .dayname.is-today { color: var(--blue); font-weight: 700; }
.tt .hours { position: relative; color: var(--muted); }
.tt .hours span { position: absolute; right: 6px; transform: translateY(-50%); font-family: var(--num); font-size: 10px; }
.tt .col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--h) - 1px), var(--empty) calc(var(--h) - 1px) var(--h)); }
.tt .col.is-today { background-color: #f7f9fc; }
.blk { position: absolute; left: 2px; right: 2px; border-radius: 6px; padding: 3px 4px; overflow: hidden; text-align: left; border: none; font-size: 11px; line-height: 1.25; background: var(--b1); color: var(--blue); }
.blk.todo { background: var(--card); border: 1.5px dashed var(--b3); color: var(--fg); }
.blk.done { opacity: .45; text-decoration: line-through; }
.tt-empty { color: var(--muted); font-size: 12px; text-align: center; }

.todo-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.todo-add .when { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12px; }
.small-btn { border: none; border-radius: 10px; padding: 6px 14px; background: var(--blue); color: var(--on-blue); font-size: 13px; }
.ghost-btn { border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; background: var(--card); font-size: 13px; }
.danger { color: #a33a3a; }
.todos { display: flex; flex-direction: column; gap: 2px; max-height: 230px; overflow-y: auto; }
.todo { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--empty); }
.todo input { width: 16px; height: 16px; accent-color: var(--blue); }
.todo .txt { min-width: 0; overflow-wrap: anywhere; }
.todo.done .txt { color: var(--muted); text-decoration: line-through; }
.todo .meta { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.todo .x { border: none; background: none; color: var(--muted); font-size: 16px; padding: 2px 6px; }

/* 잔디 */
.grass-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.legend { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.scroll { overflow-x: auto; padding-bottom: 4px; }
.grass { display: grid; grid-template-rows: repeat(7, 15px); grid-auto-flow: column; grid-auto-columns: 15px; gap: 5px; width: max-content; margin: 0 auto; }
.sq { border-radius: 4px; background: var(--empty); }
.sq.l1 { background: var(--b1); }
.sq.l2 { background: var(--b2); }
.sq.l3 { background: var(--b3); }
.sq.l4 { background: var(--b4); }
.sq.now { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--muted); }
.sq.future { visibility: hidden; }
.legend .sq { width: 12px; height: 12px; }

.note { background: var(--b1); border-radius: 14px; padding: 12px 16px; font-size: 13px; }

/* 팝업 */
.modal { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modal .card { width: min(340px, 100%); display: flex; flex-direction: column; gap: 12px; animation: pop .25s ease-out; }
.modal b { font-size: 18px; font-weight: 400; }
.modal p { margin: 0; color: var(--muted); }
.center { text-align: center; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.err { color: #a33a3a; font-size: 12px; min-height: 1em; margin: 0; }

@keyframes breathe { 50% { opacity: .3; transform: scale(.8); } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .running .dot, .modal .card { animation: none; } .ring .prog { transition: none; } }
@media (max-width: 760px) {
  .wrap { padding-block: 28px; }
  .top { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="logo"><img src="favicon.svg" alt="">Study<span>Timer</span></div><div class="date" id="date"></div></div>

  <div class="note" id="note" hidden></div>

  <div class="top">
    <div class="card timer" id="timer">
      <div class="pill">
        <button type="button" id="modeWatch" class="on">스톱워치</button>
        <button type="button" id="modePomo">뽀모도로</button>
      </div>
      <div class="ring">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="46"></circle>
          <circle class="prog" id="prog" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></circle>
        </svg>
        <div class="inner">
          <div class="state"><span class="dot"></span><span id="state">쉬는 중</span></div>
          <div class="clock" id="clock">00:00:00</div>
        </div>
      </div>
      <div class="pomo-set" id="pomoSet" hidden>
        <label for="focusMin">집중
          <select id="focusMin"><option>15</option><option selected>25</option><option>30</option><option>45</option><option>50</option></select>분
        </label>
        <label for="breakMin">휴식
          <select id="breakMin"><option selected>5</option><option>10</option><option>15</option></select>분
        </label>
      </div>
      <button class="main-btn" id="toggle" type="button">시작하기</button>
      <div class="hint" id="hint"></div>
    </div>

    <div class="side">
      <div class="card today">
        <div>
          <div class="label">오늘 공부한 시간</div>
          <div class="big" id="todayTotal">0<small>분</small></div>
        </div>
        <div class="stats">
          <div><div class="label">연속</div><div class="mid" id="streak">0일</div></div>
          <div><div class="label">이번 달</div><div class="mid" id="month">0일</div></div>
          <div><div class="label">뽀모도로</div><div class="mid" id="pomoToday">0회</div></div>
        </div>
      </div>

      <div class="card plan">
        <div class="plan-head">
          <div class="pill">
            <button type="button" id="tabTT" class="on">시간표</button>
            <button type="button" id="tabTodo">ToDoList</button>
          </div>
          <button class="plus" id="addClass" type="button" title="고정 시간표 추가">+</button>
        </div>

        <div id="ttPane">
          <div class="tt-scroll"><div class="tt" id="tt"></div></div>
        </div>

        <div id="todoPane" hidden>
          <form class="todo-add" id="todoForm">
            <input type="text" id="todoText" placeholder="할 일을 적어요" autocomplete="off">
            <button class="small-btn" type="submit">추가</button>
            <div class="when">
              <select id="todoDay"><option value="">시간표에 안 넣기</option></select>
              <input type="time" id="todoStart" step="600" disabled>
              ~
              <input type="time" id="todoEnd" step="600" disabled>
            </div>
          </form>
          <div class="hint" style="text-align:left;margin:8px 0 4px">ToDo는 만든 지 일주일이 지나면 자동으로 사라져요</div>
          <div class="todos" id="todos"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="grass-head">
      <div class="label">최근 20주</div>
      <div class="legend">쉰 날 <span class="sq"></span><span class="sq l1"></span><span class="sq l2"></span><span class="sq l3"></span><span class="sq l4"></span> 4시간+</div>
    </div>
    <div class="scroll"><div class="grass" id="grass"></div></div>
  </div>
</div>

<div class="modal" id="alarmModal" hidden>
  <div class="card center">
    <b id="alarmTitle"></b>
    <p id="alarmText"></p>
    <button class="main-btn" id="alarmOk" type="button">확인</button>
  </div>
</div>

<div class="modal" id="classModal" hidden>
  <form class="card" id="classForm">
    <b>고정 시간표 추가</b>
    <label class="field" for="className">이름
      <input type="text" id="className" placeholder="예: 자료구조" autocomplete="off">
    </label>
    <div class="field-row">
      <label class="field" for="classDay">요일<select id="classDay"></select></label>
      <label class="field" for="classStart">시작<input type="time" id="classStart" step="600" value="09:00"></label>
      <label class="field" for="classEnd">끝<input type="time" id="classEnd" step="600" value="10:30"></label>
    </div>
    <p class="err" id="classErr"></p>
    <div class="btns">
      <button class="ghost-btn" type="button" id="classCancel">취소</button>
      <button class="small-btn" type="submit">추가</button>
    </div>
  </form>
</div>

<div class="modal" id="blockModal" hidden>
  <div class="card">
    <b id="blockTitle"></b>
    <p id="blockText"></p>
    <div class="btns">
      <button class="ghost-btn" type="button" id="blockClose">닫기</button>
      <button class="ghost-btn danger" type="button" id="blockDelete">삭제</button>
    </div>
  </div>
</div>

<script>
const WEEKS = 20;
const KEY = "studytimer";
const WEEK_MS = 7 * 24 * 3600 * 1000;
const DAYS = ["월", "화", "수", "목", "금", "토", "일"]; // 시간표 요일 (0 = 월요일)
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hms = s => `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const weekday = d => (d.getDay() + 6) % 7;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// 시작 시각만 저장하고 지금 시각과의 차이로 계산 → 페이지를 닫아도 시간이 흐름
const S = {
  days: {},        // "YYYY-MM-DD" -> 공부한 초
  pomos: {},       // "YYYY-MM-DD" -> 끝낸 뽀모도로 수
  mode: "watch",   // "watch" | "pomo"
  watchStart: null,
  pomo: null,      // { phase: "focus" | "break", start, end }
  focusMin: 25,
  breakMin: 5,
  classes: [],     // 고정 시간표 { id, name, day, start, end } — 직접 지우기 전까지 유지
  todos: [],       // { id, text, done, created, day?, start?, end? } — 만든 지 일주일 뒤 삭제
  tab: "tt",
};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY))); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let lastDay = keyOf(new Date());
let alarmOn = false;
let audio = null;
let openBlock = null; // 팝업에 띄운 시간표 칸 { kind, id }

// 자정을 넘긴 공부 시간을 날짜별로 나눔
function splitByDay(start, end) {
  const out = {};
  for (let t = start; t < end;) {
    const d = new Date(t);
    const next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
    const e = Math.min(end, next);
    out[keyOf(d)] = (out[keyOf(d)] || 0) + (e - t) / 1000;
    t = e;
  }
  return out;
}

function record(start, end) {
  const parts = splitByDay(start, end);
  for (const k in parts) S.days[k] = Math.round((S.days[k] || 0) + parts[k]);
}

function liveRange() {
  const now = Date.now();
  if (S.watchStart) return [S.watchStart, now];
  if (S.pomo?.phase === "focus") return [S.pomo.start, Math.min(now, S.pomo.end)];
  return null;
}

function secondsOn(key) {
  const r = liveRange();
  return (S.days[key] || 0) + (r ? splitByDay(r[0], r[1])[key] || 0 : 0);
}

function running() { return !!(S.watchStart || S.pomo); }

function renderClock() {
  const now = Date.now();
  let shown, ratio;
  if (S.mode === "watch") {
    const s = S.watchStart ? Math.floor((now - S.watchStart) / 1000) : 0;
    shown = s; ratio = (s % 3600) / 3600;
  } else if (S.pomo) {
    shown = Math.max(0, Math.ceil((S.pomo.end - now) / 1000));
    ratio = (now - S.pomo.start) / (S.pomo.end - S.pomo.start);
  } else {
    shown = S.focusMin * 60; ratio = 0;
  }
  $("clock").textContent = hms(shown);
  $("prog").style.strokeDashoffset = 100 - Math.min(1, ratio) * 100;
  document.title = alarmOn ? "● 시간 종료 · StudyTimer" : running() ? `${hms(shown)} · StudyTimer` : "StudyTimer";

  const today = Math.floor(secondsOn(keyOf(new Date())) / 60);
  $("todayTotal").innerHTML = today >= 60
    ? `${Math.floor(today / 60)}<small>시간</small> ${today % 60}<small>분</small>`
    : `${today}<small>분</small>`;
}

function renderStats() {
  const now = new Date();
  const pomoMode = S.mode === "pomo";
  const resting = S.pomo?.phase === "break";
  $("date").textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${"일월화수목금토"[now.getDay()]}요일`;

  $("modeWatch").classList.toggle("on", !pomoMode);
  $("modePomo").classList.toggle("on", pomoMode);
  $("modeWatch").disabled = $("modePomo").disabled = running();
  $("pomoSet").hidden = !pomoMode;
  $("focusMin").value = S.focusMin;
  $("breakMin").value = S.breakMin;
  $("focusMin").disabled = $("breakMin").disabled = running();

  $("timer").classList.toggle("running", running());
  $("timer").classList.toggle("resting", resting);
  $("state").textContent = resting ? "쉬는 시간" : running() ? "공부 중" : "쉬는 중";
  $("toggle").textContent = resting ? "휴식 건너뛰기" : running() ? "그만하기" : "시작하기";
  $("hint").textContent = pomoMode
    ? "시간이 끝나면 다른 창을 보고 있어도 알림이 와요"
    : "링 한 바퀴가 1시간 · 스페이스바로도 켜고 꺼요";

  // 오늘을 아직 안 했으면 어제부터 셈
  let streak = 0;
  const d = new Date(now);
  if (!secondsOn(keyOf(d))) d.setDate(d.getDate() - 1);
  while (secondsOn(keyOf(d)) > 0) { streak++; d.setDate(d.getDate() - 1); }
  $("streak").textContent = `${streak}일`;

  let month = 0;
  for (const c = new Date(now.getFullYear(), now.getMonth(), 1); c <= now; c.setDate(c.getDate() + 1)) {
    if (secondsOn(keyOf(c)) > 0) month++;
  }
  $("month").textContent = `${month}일`;
  $("pomoToday").textContent = `${S.pomos[keyOf(now)] || 0}회`;

  renderGrass(now);
  renderClock();
}

function level(sec) {
  const h = sec / 3600;
  return sec <= 0 ? 0 : h < 1 ? 1 : h < 2 ? 2 : h < 4 ? 3 : 4;
}

function renderGrass(now) {
  const todayKey = keyOf(now);
  const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() - (WEEKS - 1) * 7);
  const cells = [];
  for (let i = 0; i < WEEKS * 7; i++) {
    const k = keyOf(day);
    const sec = secondsOn(k);
    const cls = ["sq"];
    if (sec > 0) cls.push("l" + level(sec));
    if (k === todayKey) cls.push("now");
    if (day > now) cls.push("future");
    cells.push(`<span class="${cls.join(" ")}" title="${k} · ${Math.round(sec / 60)}분"></span>`);
    day.setDate(day.getDate() + 1);
  }
  $("grass").innerHTML = cells.join("");
}

// ---------- 시간표 / ToDo ----------

function pruneTodos() {
  const before = S.todos.length;
  S.todos = S.todos.filter(t => Date.now() - t.created < WEEK_MS);
  if (S.todos.length !== before) save();
}

function daysLeft(t) {
  return Math.max(1, Math.ceil((t.created + WEEK_MS - Date.now()) / (24 * 3600 * 1000)));
}

function renderPlan() {
  const tt = S.tab === "tt";
  $("tabTT").classList.toggle("on", tt);
  $("tabTodo").classList.toggle("on", !tt);
  $("ttPane").hidden = !tt;
  $("todoPane").hidden = tt;
  $("addClass").hidden = !tt;
  renderTimetable();
  renderTodos();
}

function renderTimetable() {
  const H = 26; // 한 시간 높이(px)
  const blocks = [
    ...S.classes.map(c => ({ ...c, kind: "class" })),
    ...S.todos.filter(t => t.day !== undefined).map(t => ({ ...t, name: t.text, kind: "todo" })),
  ];
  // 기본 9시~22시, 그 밖의 일정이 있으면 넓힘
  let from = 9, to = 22;
  blocks.forEach(b => { from = Math.min(from, Math.floor(toMin(b.start) / 60)); to = Math.max(to, Math.ceil(toMin(b.end) / 60)); });

  const today = weekday(new Date());
  let html = `<div class="dayname"></div>`;
  DAYS.forEach((d, i) => html += `<div class="dayname${i === today ? " is-today" : ""}">${d}</div>`);

  let hours = "";
  for (let h = from + 1; h < to; h++) hours += `<span style="top:${(h - from) * H}px">${h}</span>`;
  html += `<div class="hours" style="height:${(to - from) * H}px">${hours}</div>`;

  DAYS.forEach((_, i) => {
    let col = "";
    blocks.filter(b => b.day === i).forEach(b => {
      const top = (toMin(b.start) - from * 60) / 60 * H;
      const height = Math.max(14, (toMin(b.end) - toMin(b.start)) / 60 * H - 2);
      const cls = ["blk", b.kind === "todo" ? "todo" : "", b.done ? "done" : ""].join(" ");
      col += `<button type="button" class="${cls}" style="top:${top}px;height:${height}px" data-kind="${b.kind}" data-id="${b.id}" title="${esc(b.name)} ${b.start}~${b.end}">${esc(b.name)}</button>`;
    });
    html += `<div class="col${i === today ? " is-today" : ""}" style="--h:${H}px;height:${(to - from) * H}px">${col}</div>`;
  });
  $("tt").innerHTML = html;
}

function renderTodos() {
  if (!S.todos.length) {
    $("todos").innerHTML = `<div class="tt-empty" style="padding:18px 0">아직 할 일이 없어요</div>`;
    return;
  }
  $("todos").innerHTML = [...S.todos].sort((a, b) => a.done - b.done || a.created - b.created).map(t => {
    const when = t.day !== undefined ? `${DAYS[t.day]} ${t.start}~${t.end} · ` : "";
    return `<div class="todo${t.done ? " done" : ""}">
      <input type="checkbox" data-id="${t.id}" ${t.done ? "checked" : ""} aria-label="완료">
      <div class="txt">${esc(t.text)}<span class="meta">${when}${daysLeft(t)}일 뒤 사라져요</span></div>
      <button type="button" class="x" data-id="${t.id}" aria-label="삭제">×</button>
    </div>`;
  }).join("");
}

function setTab(tab) { S.tab = tab; save(); renderPlan(); }
$("tabTT").addEventListener("click", () => setTab("tt"));
$("tabTodo").addEventListener("click", () => setTab("todo"));

const dayOptions = DAYS.map((d, i) => `<option value="${i}">${d}요일</option>`).join("");
$("classDay").innerHTML = dayOptions;
$("todoDay").insertAdjacentHTML("beforeend", dayOptions);

$("addClass").addEventListener("click", () => {
  $("classErr").textContent = "";
  $("classDay").value = weekday(new Date());
  $("classModal").hidden = false;
  $("className").focus();
});
$("classCancel").addEventListener("click", () => { $("classModal").hidden = true; });
$("classForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("className").value.trim();
  const start = $("classStart").value, end = $("classEnd").value;
  if (!name) return $("classErr").textContent = "이름을 적어 주세요.";
  if (!start || !end || toMin(end) <= toMin(start)) return $("classErr").textContent = "끝나는 시간이 시작보다 늦어야 해요.";
  S.classes.push({ id: uid(), name, day: +$("classDay").value, start, end });
  save();
  $("className").value = "";
  $("classModal").hidden = true;
  renderTimetable();
});

$("todoDay").addEventListener("change", () => {
  const off = $("todoDay").value === "";
  $("todoStart").disabled = $("todoEnd").disabled = off;
  if (!off && !$("todoStart").value) { $("todoStart").value = "19:00"; $("todoEnd").value = "20:00"; }
});
$("todoForm").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("todoText").value.trim();
  if (!text) return;
  const todo = { id: uid(), text, done: false, created: Date.now() };
  if ($("todoDay").value !== "") {
    const start = $("todoStart").value, end = $("todoEnd").value;
    if (!start || !end || toMin(end) <= toMin(start)) return showNote("ToDo 끝나는 시간이 시작보다 늦어야 해요.");
    Object.assign(todo, { day: +$("todoDay").value, start, end });
  }
  S.todos.push(todo);
  save();
  showNote("");
  $("todoText").value = "";
  renderPlan();
});
$("todos").addEventListener("click", e => {
  const id = e.target.dataset.id;
  if (!id) return;
  if (e.target.type === "checkbox") {
    const t = S.todos.find(t => t.id === id);
    t.done = e.target.checked;
  } else {
    S.todos = S.todos.filter(t => t.id !== id);
  }
  save();
  renderPlan();
});

// 시간표 칸을 누르면 정보 + 삭제
$("tt").addEventListener("click", e => {
  const b = e.target.closest(".blk");
  if (!b) return;
  openBlock = { kind: b.dataset.kind, id: b.dataset.id };
  const item = openBlock.kind === "class"
    ? S.classes.find(c => c.id === openBlock.id)
    : S.todos.find(t => t.id === openBlock.id);
  $("blockTitle").textContent = item.name || item.text;
  $("blockText").textContent = `${DAYS[item.day]}요일 ${item.start}~${item.end} · ` +
    (openBlock.kind === "class" ? "고정 시간표" : `ToDo, ${daysLeft(item)}일 뒤 사라져요`);
  $("blockModal").hidden = false;
});
$("blockClose").addEventListener("click", () => { $("blockModal").hidden = true; });
$("blockDelete").addEventListener("click", () => {
  if (openBlock.kind === "class") S.classes = S.classes.filter(c => c.id !== openBlock.id);
  else S.todos = S.todos.filter(t => t.id !== openBlock.id);
  save();
  $("blockModal").hidden = true;
  renderPlan();
});

// ---------- 알람 ----------

function showNote(text) {
  $("note").textContent = text;
  $("note").hidden = !text;
}

function chime() {
  if (!audio) return;
  [0, 0.35, 0.7].forEach(t => {
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audio.currentTime + t);
    g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.3);
    o.connect(g).connect(audio.destination);
    o.start(audio.currentTime + t);
    o.stop(audio.currentTime + t + 0.32);
  });
}

// Windows 알림(우측 하단) + 페이지 팝업 + 소리
function alarm(title, text) {
  alarmOn = true;
  $("alarmTitle").textContent = title;
  $("alarmText").textContent = text;
  $("alarmModal").hidden = false;
  chime();
  if ("Notification" in window && Notification.permission === "granted") {
    const n = new Notification(title, { body: text, tag: "studytimer", requireInteraction: true });
    n.onclick = () => { window.focus(); n.close(); };
  }
}

$("alarmOk").addEventListener("click", () => {
  alarmOn = false;
  $("alarmModal").hidden = true;
  renderClock();
});

// 끝난 단계를 처리 (페이지를 닫아 둔 사이에 여러 단계가 끝났을 수도 있음)
function checkPomo() {
  let msg = null;
  while (S.pomo && Date.now() >= S.pomo.end) {
    if (S.pomo.phase === "focus") {
      record(S.pomo.start, S.pomo.end);
      const k = keyOf(new Date(S.pomo.end));
      S.pomos[k] = (S.pomos[k] || 0) + 1;
      S.pomo = { phase: "break", start: S.pomo.end, end: S.pomo.end + S.breakMin * 60000 };
      msg = ["집중 시간이 끝났어요!", `${S.breakMin}분 쉬고 와요.`];
    } else {
      S.pomo = null;
      msg = ["쉬는 시간이 끝났어요!", "다시 집중해 볼까요?"];
    }
  }
  if (msg) {
    save();
    renderStats();
    alarm(...msg);
  }
}

async function toggle() {
  if (S.mode === "watch") {
    if (!S.watchStart) S.watchStart = Date.now();
    else { record(S.watchStart, Date.now()); S.watchStart = null; }
  } else if (!S.pomo) {
    audio = audio || new AudioContext();
    if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission();
    if (!("Notification" in window) || Notification.permission !== "granted") {
      showNote("알림이 꺼져 있어 Windows 알림은 오지 않아요. 주소창 왼쪽 자물쇠 → 알림 → 허용으로 켤 수 있어요. 소리와 팝업은 그대로 울려요.");
    } else showNote("");
    S.pomo = { phase: "focus", start: Date.now(), end: Date.now() + S.focusMin * 60000 };
  } else {
    if (S.pomo.phase === "focus") record(S.pomo.start, Date.now());
    S.pomo = null;
  }
  save();
  renderStats();
}

function setMode(mode) {
  if (running()) return;
  S.mode = mode;
  save();
  renderStats();
}

$("toggle").addEventListener("click", toggle);
$("modeWatch").addEventListener("click", () => setMode("watch"));
$("modePomo").addEventListener("click", () => setMode("pomo"));
$("focusMin").addEventListener("change", e => { S.focusMin = +e.target.value; save(); renderClock(); });
$("breakMin").addEventListener("change", e => { S.breakMin = +e.target.value; save(); });
document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target === document.body) { e.preventDefault(); toggle(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderStats(); });

// 다른 창을 보고 있어도 제때 울리도록, 백그라운드에서 느려지지 않는 Worker로 1초마다 확인
function tick() {
  checkPomo();
  const k = keyOf(new Date());
  if (k !== lastDay) { lastDay = k; pruneTodos(); renderStats(); renderPlan(); }
  else if (running()) renderClock();
}
try {
  new Worker(URL.createObjectURL(new Blob(["setInterval(() => postMessage(0), 1000)"]))).onmessage = tick;
} catch (e) {
  setInterval(tick, 1000);
}

pruneTodos();
renderStats();
renderPlan();
checkPomo();
</script>
</body>
</html>
